<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новая вкладка</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wallpaper-container">
    <div id="wallpaper-image-back"></div>
    <div id="wallpaper-image"></div>
    <video id="wallpaper-video" autoplay loop muted playsinline></video>
    <div id="wallpaper-overlay"></div>
  </div>

  <!-- Индикатор активного режима сетки (появляется только при включении редактирования) -->
  <div id="edit-mode-bar" class="edit-mode-bar hidden">
    <span>Режим сетки: перетаскивайте карточки или меняйте размер</span>
    <button id="btn-exit-edit" class="btn-mini">Готово</button>
  </div>

  <!-- Главная Bento-сетка -->
  <main id="bento-grid" class="bento-grid"></main>

  <!-- Миниатюрное командное меню (Alt + K или Ctrl + K) -->
  <div id="quick-dock-backdrop" class="quick-dock-backdrop hidden">
    <div class="quick-dock" role="dialog" aria-label="Быстрое управление">
      <div class="quick-dock-header">
        <span>Управление пространством</span>
        <kbd>Alt + K</kbd>
      </div>
      <div class="quick-dock-actions">
        <button class="dock-action-btn" id="dock-zen">
          <div class="dock-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
          <div class="dock-text">
            <strong>Скрытость (Дзен)</strong>
            <span>Скрыть или вернуть все виджеты</span>
          </div>
          <span class="dock-status" id="status-zen">Выкл</span>
        </button>

        <button class="dock-action-btn" id="dock-grid">
          <div class="dock-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </div>
          <div class="dock-text">
            <strong>Управление виджетами</strong>
            <span>Перемещение и размер блоков</span>
          </div>
          <span class="dock-status" id="status-grid">Выкл</span>
        </button>

        <button class="dock-action-btn" id="dock-customize">
          <div class="dock-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </div>
          <div class="dock-text">
            <strong>Кастомизация и виджеты</strong>
            <span>Добавить модули, обои и стиль</span>
          </div>
          <span class="dock-arrow">→</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Выезжающая панель настроек и добавления виджетов -->
  <aside id="settings-drawer" class="settings-drawer">
    <div class="drawer-header">
      <h2>Кастомизация и Виджеты</h2>
      <button id="btn-close-settings" class="icon-btn">&times;</button>
    </div>

    <div class="drawer-content">
      <section class="settings-section">
        <h3>Библиотека виджетов</h3>
        <p class="section-hint">Включайте и отключайте модули в один клик</p>
        <div id="widget-toggles" class="widget-toggles-grid"></div>
      </section>

      <section class="settings-section">
        <h3>Часы и Адаптивный цвет</h3>
        <div class="control-row">
          <label>Цвет кнопок под обложку YTM</label>
          <input type="checkbox" id="chk-dynamic-accent" checked>
        </div>
        <div class="control-row">
          <label>24-часовой формат</label>
          <input type="checkbox" id="chk-clock-24h" checked>
        </div>
        <div class="control-row">
          <label>Показывать секунды</label>
          <input type="checkbox" id="chk-clock-sec" checked>
        </div>
      </section>

      <section class="settings-section">
        <h3>Обои и живые фоны</h3>
        <div class="preset-wallpapers" id="preset-wallpapers"></div>
        
        <div class="upload-zone">
          <label for="wallpaper-upload" class="btn-primary full-width">
            + Загрузить фото / GIF / MP4
          </label>
          <input type="file" id="wallpaper-upload" accept="image/*,video/mp4,video/webm" multiple hidden>
        </div>

        <div id="custom-wallpapers-list" class="custom-wallpapers-list"></div>

        <div class="control-row">
          <label>Автосмена обоев</label>
          <select id="wallpaper-rotation">
            <option value="off">Выключена</option>
            <option value="newtab">При каждом открытии вкладки</option>
            <option value="daily">Раз в сутки</option>
          </select>
        </div>

        <div class="control-row">
          <label>Размытие фона: <span id="val-bg-blur">0px</span></label>
          <input type="range" id="range-bg-blur" min="0" max="40" value="0">
        </div>

        <div class="control-row">
          <label>Затемнение фона: <span id="val-bg-dim">35%</span></label>
          <input type="range" id="range-bg-dim" min="0" max="85" value="35">
        </div>

        <div class="control-row">
          <label>Параллакс при движении мыши</label>
          <input type="checkbox" id="chk-parallax" checked>
        </div>
      </section>

      <section class="settings-section">
        <h3>Интерфейс и Glassmorphism</h3>
        <div class="control-row">
          <label>Базовый акцентный цвет</label>
          <input type="color" id="color-accent" value="#7c5cff">
        </div>
        <div class="control-row">
          <label>Прозрачность карточек: <span id="val-card-opacity">12%</span></label>
          <input type="range" id="range-card-opacity" min="6" max="65" value="12">
        </div>
        <div class="control-row">
          <label>Скругление углов: <span id="val-card-radius">26px</span></label>
          <input type="range" id="range-card-radius" min="8" max="36" value="26">
        </div>
        <div class="control-row">
          <label>Шрифт системы</label>
          <select id="select-font">
            <option value="'Plus Jakarta Sans', system-ui, sans-serif">Plus Jakarta Sans (Чистый)</option>
            <option value="'Outfit', sans-serif">Outfit (Геометрический)</option>
            <option value="'JetBrains Mono', monospace">JetBrains Mono (Техно)</option>
          </select>
        </div>
      </section>

      <section class="settings-section">
        <h3>Резервное копирование</h3>
        <div class="btn-group">
          <button id="btn-export-config" class="btn-secondary">Экспорт (.json)</button>
          <label for="input-import-config" class="btn-secondary">Импорт (.json)</label>
          <input type="file" id="input-import-config" accept="application/json" hidden>
        </div>
        <button id="btn-reset-all" class="btn-danger full-width" style="margin-top: 10px;">Сбросить всё по умолчанию</button>
      </section>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
